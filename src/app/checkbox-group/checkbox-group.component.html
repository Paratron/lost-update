<div class="outer">
  <h2>Choose Your Favorite Shakespeare Quotes</h2>
  <h3>Reload and verify that your selections are saved (also across browsers or devices)</h3>

  <div class="checkbox-container">
    @for (checkbox of checkboxes; track checkbox.name) {
      <label class="checkbox-label">
        <input
          type="checkbox"
          class="quote-checkbox"
          [checked]="checkboxState()[checkbox.name]"
          (change)="toggle(checkbox.name)"
        />
        {{ checkbox.label }}
      </label>
    }
  </div>
</div>
